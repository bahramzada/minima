# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_SSH_KEY      private key of the web deploy key (whole file), restricted on the server to the forced command
#   DEPLOY_HOST         server address
#   DEPLOY_PORT         SSH port of the server
#   DEPLOY_KNOWN_HOSTS  known_hosts line(s) of the server
# The key can only run "web <commit SHA on origin/main>" (forced command ~/bin/deploy-minima).
name: Deploy web
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (forced command)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "raul@$DEPLOY_HOST" "web $GITHUB_SHA"
